services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-c", "envsubst '$${PAYPAL_CLIENT_ID}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && ln -sf 'gold-events-directory (1).html' /usr/share/nginx/html/index.html && chmod 755 /usr/share/nginx/html && exec nginx -g 'daemon off;'"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
