services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - .:/usr/share/nginx/html
    command: ["sh", "-c", "ln -sf 'gold-events-directory (1).html' /usr/share/nginx/html/index.html && chmod 755 /usr/share/nginx/html && exec nginx -g 'daemon off;'"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
